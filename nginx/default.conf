server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # --- security headers ---
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # --- compression ---
  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # --- never cache the shell or the live snapshot ---
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
  }

  location = /data/live.json {
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options "application/json" always;
  }

  # --- static assets: short TTL (no cache-busting via filenames) ---
  location ~* \.(js|css)$ {
    add_header Cache-Control "public, max-age=3600";
  }

  location ~* \.(svg|png|jpg|jpeg|gif|webp|ico)$ {
    add_header Cache-Control "public, max-age=604800";
  }

  # --- everything else ---
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
