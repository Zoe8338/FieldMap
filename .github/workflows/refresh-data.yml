name: refresh-event-data

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check official event pages for date changes
        run: node scripts/refresh.mjs

      - name: Commit updated live snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain data/live.json)" ]]; then
            git add data/live.json
            git commit -m "chore: refresh event date checks"
            git push
          else
            echo "No changes detected"
          fi
